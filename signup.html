<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
</head>

<body>
    <div style="position: absolute; width: 100%;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container-fluid">
                <p class="navbar-brand mb-0 h1">Sign Up Page</p>
                <div class="navbar-nav" style="gap: 24px;">
                    <div>
                        <a class="btn btn-outline-light" href="index.html">Log In</a>
                        <a class="btn btn-primary" href="signup.html">Sign Up</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="d-flex justify-content-center align-items-center"
        style="height: 100dvh; background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(images/background.jpg);">
        <form
            style="border: 2px gray solid; background: rgb(33, 32, 36); padding: 20px; border-radius: 16px; width: 20%; min-width: 300px;">
            <center>
                <h3>Sign Up</h3>
            </center>

            <hr>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>

            <input type="checkbox" name="terms" id="terms" class="form-check-input" required>
            <label for="terms">I agree to the Terms &amp; Conditions</label><br>
            <hr>

            <button type="submit" class="btn btn-primary" onclick="location.href='personalpage.html'">Sign Up</button>
            <button type="reset" class="btn btn-secondary">Cancel</button>

            <p class="mt-3 mb-0 text-center">Already have an account? <a href="index.html">Log in</a></p>
        </form>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
