<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<body>
    <div style="position: absolute; width: 100%;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container-fluid">
                <p class="navbar-brand mb-0 h1">Login Page</p>
                <div class="navbar-nav" style="gap: 24px;">
                    <div>
                        <a class="btn btn-outline-light" href="index.html">Homepage</a>
                        <a class="btn btn-outline-light" href="landingpage_css.html">Landing Page (CSS)</a>
                        <a class="btn btn-outline-light" href="landingpage_bootstrap.html">Landing Page (Bootstrap)</a>
                    </div>
                    <div>
                        <a class="btn btn-primary" href="login.html">Log In</a>
                        <a class="btn btn-outline-light" href="">Sign Up</a>
                    </div>
                </div>
        </nav>
    </div>

    <div class="d-flex justify-content-center align-items-center"
        style="height: 100dvh; background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(images/background.jpg);">
        <div
            style="border: 2px gray solid; background: rgb(33, 32, 36); padding: 20px; border-radius: 16px; width: 20%;">
            <center>
                <h3>Log In</h3>
            </center>

            <hr>

            <div class="mb-3">
                <label for="formGroupExampleInput" class="form-label">Username</label>
                <input type="text" class="form-control" id="formGroupExampleInput">
            </div>
            <div class="mb-3">
                <label for="formGroupExampleInput2" class="form-label">Password</label>
                <input type="password" class="form-control" id="formGroupExampleInput2">
            </div>

            <input type="checkbox" name="rememberMe" id="rememberMe" class="form-check-input">
            <label for="rememberMe">Remember me </label><br>
            <hr>

            <button class="btn btn-primary">Login</button>
            <button class="btn btn-secondary">Cancel</button>

        </div>
    </div>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
